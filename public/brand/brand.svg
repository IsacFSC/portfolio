<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente do fundo: Do preto absoluto para um grafite escuro (Terminal Premium) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#1F1F1F" />
    </linearGradient>

    <!-- Gradiente do Símbolo principal: Do branco puro para o cinza metálico -->
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E5E5E5" />
      <stop offset="100%" stop-color="#737373" />
    </linearGradient>

    <!-- Gradiente de Brilho da Borda do Terminal -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#404040" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>
  </defs>

  <!-- Corpo da Janela do Terminal -->
  <rect x="16" y="16" width="480" height="480" rx="48" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Detalhes do Terminal: Três botões clássicos de janela em tons de cinza -->
  <circle cx="64" cy="64" r="8" fill="#404040" />
  <circle cx="92" cy="64" r="8" fill="#262626" />
  <circle cx="120" cy="64" r="8" fill="#171717" />

  <!-- SÍMBOLO CENTRAL (Fusão de Terminal >_ , Código </>, Iniciais I e F) -->
  <g transform="translate(40, 20)">
    <!-- O Prompt ">" que forma a estrutura da letra I e o topo do F -->
    <path d="M 120,160 L 220,240 L 120,320" 
          fill="none" 
          stroke="url(#symbolGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- A Barra Horizontal do "F" estilo prompt piscante (Underline) estendido -->
    <path d="M 220,240 L 320,240" 
          fill="none" 
          stroke="url(#symbolGrad)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- O Cursor do Terminal / Traço inferior do F -->
    <path d="M 180,320 L 280,320" 
          fill="none" 
          stroke="#A3A3A3" 
          stroke-width="28" 
          stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Texto Discreto de Fechamento de Tag no rodapé (Apenas para contexto de Full Stack) -->
  <text x="444" y="456" 
        font-family="monospace" 
        font-size="28" 
        font-weight="bold" 
        fill="#404040" 
        text-anchor="end">&lt;/&gt;</text>
</svg>
